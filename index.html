<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工具箱 · H5 工具矩阵</title>
<meta name="description" content="每日自动新增的免费 H5 小工具矩阵：小红书排版、周报生成、倒计时等，纯前端、即开即用。">
<style>
:root{
  --bg1:#eef1ff; --bg2:#fdeef6; --card:#fff; --primary:#5b6bff; --primary-2:#ff6bb0;
  --primary-soft:#e6e9ff; --text:#23263a; --muted:#8a8fb0; --radius:22px;
  --shadow:0 16px 44px rgba(91,107,255,.14);
}
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);
  padding:24px 16px 56px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;margin-bottom:8px;animation:fadeUp .5s ease both}
header h1{font-size:30px;margin:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
header .sub{color:var(--muted);font-size:14px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--primary);
  background:var(--primary-soft);padding:6px 14px;border-radius:999px;animation:fadeUp .6s ease both}
.stat{display:flex;justify-content:center;gap:26px;margin:20px 0 8px}
.stat div{text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--primary)}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
.tool{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;
  text-decoration:none;color:inherit;display:block;transition:transform .18s,box-shadow .18s;animation:fadeUp .5s ease both}
.tool:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgba(91,107,255,.22)}
.tool .ic{font-size:34px}
.tool .nm{font-size:17px;font-weight:700;margin:10px 0 6px}
.tool .ds{font-size:13px;color:var(--muted);line-height:1.5;min-height:42px}
.tool .go{margin-top:12px;font-size:13px;font-weight:700;color:var(--primary)}
.tool .kw{margin-top:8px;font-size:11px;color:#b0b4cc}
.loading,.err{padding:40px;text-align:center;color:var(--muted)}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧰 我的工具箱</h1>
    <div class="sub">每天 06:00 自动新增的免费 H5 小工具 · 即开即用 · 数据不上传</div>
    <div class="badge">⚡ 由 AI 每日自动构建</div>
  </header>
  <div class="stat">
    <div><b id="cnt">…</b><span>已上线工具</span></div>
    <div><b>0</b><span>付费</span></div>
    <div><b id="upd">—</b><span>最近更新</span></div>
  </div>
  <div id="grid" class="grid"><div class="loading">正在加载工具列表…</div></div>
  <footer>纯前端工具矩阵 · 无需登录 · 链接长期有效</footer>
</div>
<script>
const FALLBACK=[
  {icon:"📒",name:"小红书笔记排版器",desc:"一键生成带 emoji、分段、话题标签的爆款排版",path:"xiaohongshu-formatter/",kw:"小红书排版 / 笔记排版"},
  {icon:"📝",name:"AI 周报生成器",desc:"输入要点，自动生成规范周报，多风格可切换",path:"weekly-report/",kw:"周报生成器 / 日报"},
  {icon:"⏳",name:"倒计时 · 纪念日",desc:"实时秒级倒数，支持分类与本地保存",path:"countdown/",kw:"倒计时 / 考研倒计时"}
];
function render(list,updated){
  document.getElementById('cnt').textContent=list.length;
  document.getElementById('upd').textContent=updated||'今日';
  const g=document.getElementById('grid');g.innerHTML='';
  list.forEach((t,i)=>{
    const a=document.createElement('a');a.className='tool';a.href=t.path;a.style.animationDelay=(i*0.04)+'s';
    a.innerHTML=`<div class="ic">${t.icon||'🛠️'}</div><div class="nm">${t.name}</div>
      <div class="ds">${t.desc||''}</div><div class="kw">${(t.keywords||[]).join(' / ')||''}</div>
      <div class="go">打开工具 ↗</div>`;
    g.appendChild(a);
  });
}
fetch('./manifest.json').then(r=>r.json()).then(m=>{
  render(m.apps||FALLBACK, m.updated);
}).catch(()=>render(FALLBACK,'今日'));
</script>
</body>
</html>
