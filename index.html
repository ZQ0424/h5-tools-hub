:root{

  --shadow:0 6px 20px rgba(91,107,255,.08);
}
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;

.wrap{max-width:980px;margin:0 auto}
header{margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header h1{font-size:20px;margin:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.4px}
header .sub{color:var(--muted);font-size:11px;margin-top:3px}
.stat{display:flex;gap:12px;margin:8px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}
.stat b{color:var(--primary);font-weight:800}
.langsel{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.langsel select{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:12px;
  background:#fff;color:var(--text);outline:none;box-shadow:var(--shadow)}
.search{position:sticky;top:6px;z-index:20;margin:8px 0}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;background:rgba(255,255,255,.92);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--primary)}
.tabs{display:flex;gap:5px;margin:8px 0;overflow-x:auto}
.tab{flex:1;text-align:center;padding:7px 9px;border-radius:10px;font-size:12.5px;font-weight:700;
  background:#fff;color:var(--muted);cursor:pointer;border:1px solid var(--line);white-space:nowrap;min-width:64px}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.cats{display:flex;gap:6px;margin:8px 0;overflow-x:auto;padding-bottom:2px}
.cat{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:#fff;color:var(--muted);cursor:pointer;border:1px solid var(--line);white-space:nowrap}
.cat.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.cat .n{font-size:10px;opacity:.75;margin-left:2px}
.hot{display:none;margin-bottom:10px}
.hot.show{display:block}
.hot h3{font-size:11.5px;color:var(--muted);margin:0 0 6px;font-weight:700}
.hot-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.hot-card{flex:0 0 auto;min-width:118px;background:#fff;border-radius:12px;padding:9px 11px;
  box-shadow:var(--shadow);text-decoration:none;color:inherit;border:1px solid var(--line)}
.hot-card .rk{font-size:11px;color:var(--primary);font-weight:800}
.hot-card .nm{font-size:12.5px;font-weight:700;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-card .vt{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tool{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 12px;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);
  transition:transform .15s,box-shadow .15s;animation:fadeUp .35s ease both;position:relative}
.tool:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(91,107,255,.16)}
.tool .top{display:flex;align-items:center;gap:6px}
.tool .ic{font-size:19px;line-height:1}
.tool .nm{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .ds{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool .kw{font-size:10px;color:#b6bad0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .bot{display:flex;align-items:center;gap:5px;margin-top:1px}
.tool .act{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--primary);
  background:var(--primary-soft);border:none;padding:4px 8px;border-radius:999px;cursor:pointer}
.tool .act:active{transform:scale(.94)}
.tool .act.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.tool .views{font-size:11px;color:var(--muted);margin-left:auto}
.empty{padding:34px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;line-height:1.6}
.vipbtn{border:none;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ffd86b,#ff9a3c);box-shadow:0 6px 16px rgba(255,154,60,.3);cursor:pointer}
.vipbtn:active{transform:scale(.96)}
.userbtn{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;background:#fff;color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
.userbtn.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.authFld{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;margin:6px 0;outline:none}
.authFld:focus{border-color:var(--primary)}
.authToggle{font-size:12px;color:var(--primary);cursor:pointer;text-align:center;margin:6px 0}
.payPlans{display:flex;gap:8px;margin:8px 0}
.payPlan{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.payPlan.on{border-color:var(--primary);background:#f6f7ff}
.payPlan b{display:block;font-size:17px;color:var(--primary-2)}
.payPlan span{font-size:11px;color:var(--muted)}
.payTabs{display:flex;gap:6px;margin-bottom:8px}
.payTabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:13px;font-weight:700;cursor:pointer}
.payTabs button.on.wx{border-color:#25ab3a;color:#25ab3a}
.payTabs button.on.ali{border-color:#1677ff;color:#1677ff}
.payQr{text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;background:#f7f8ff;border-radius:12px;padding:10px}
.payQr img{width:160px;height:160px;border-radius:8px}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(20,22,40,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:340px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.sheet h3{margin:0 0 10px;font-size:15px}
.sheet img.poster{width:100%;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.sheet .btns{display:flex;gap:8px;margin-top:12px}
.sheet .btns button{flex:1;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer}
.b1{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.b2{background:var(--primary-soft);color:var(--primary)}
.sheet .x{float:right;border:none;background:none;font-size:16px;color:var(--muted);cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

let LANG=localStorage.getItem(LANGKEY);
if(!LANG){
  // 自动检测：优先浏览器语言，其次按需 IP 检测
  const nav=(navigator.language||navigator.userLanguage||'zh').toLowerCase();
  const m=nav.slice(0,2);
  const supported=['zh','en','ja','ko','es','fr','de','ru','pt','ar','hi','vi','th','id'];
  LANG=supported.includes(m)?m:'en';
  // 浏览器语言只有大类时细化：zh 默认中文
  if(LANG==='zh'&&!nav.startsWith('zh'))LANG='en';
  localStorage.setItem(LANGKEY,LANG);
}
function T(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||I18N.zh[k]||k;}
function applyLang(){
  const map={zh:'zh-CN',en:'en',ja:'ja',ko:'ko',es:'es',fr:'fr',de:'de',ru:'ru',pt:'pt',ar:'ar',hi:'hi',vi:'vi',th:'th',id:'id'};
  document.documentElement.lang=map[LANG]||'zh-CN';
  document.getElementById('t_title').textContent=T('title');
  document.getElementById('t_sub').textContent=T('sub');
  document.getElementById('q').placeholder=T('search');
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;const v=T(k);if(typeof v==='string')el.textContent=v;});
  document.getElementById('shareTip').textContent=T('share_tip');
  document.getElementById('btnCopy').textContent=T('copy_link');
  document.getElementById('btnSave').textContent=T('save_poster');
  localStorage.setItem(LANGKEY,LANG);
  render();
}
document.getElementById('lang').value=LANG;
document.getElementById('lang').addEventListener('change',e=>{LANG=e.target.value;applyLang();});

/* ---- 存取 ---- */
function getVotes(){try{return JSON.parse(localStorage.getItem(VKEY)||'{}')}catch(e){return{}}}
function setVotes(v){localStorage.setItem(VKEY,JSON.stringify(v))}
function getLiked(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){return[]}}
function setLiked(a){localStorage.setItem(LKEY,JSON.stringify(a))}
function getFav(){try{return JSON.parse(localStorage.getItem(FKEY)||'[]')}catch(e){return[]}}
function setFav(a){localStorage.setItem(FKEY,JSON.stringify(a))}
/* ---- 登录 + 收藏云同步 ---- */
const AKEY='h5hub_auth';
function getAuth(){try{return JSON.parse(localStorage.getItem(AKEY)||'null')}catch(e){return null}}
function setAuth(a){if(a)localStorage.setItem(AKEY,JSON.stringify(a));else localStorage.removeItem(AKEY)}
function authHdr(){const a=getAuth();const t=a?a.access_token:ANON_KEY;return{apikey:ANON_KEY,Authorization:'Bearer '+t};}
function authBearer(){const a=getAuth();return a&&a.access_token?a.access_token:null;}
let authMode='signin';
document.getElementById('userBtn').onclick=function(){
  const a=getAuth();
  if(a){if(confirm('已登录：'+(a.user&&a.user.email||'')+'\n退出登录？')){setAuth(null);paintUser();render();}return;}
  document.getElementById('authMsg').textContent='';
  document.getElementById('authMask').classList.add('show');
};
document.getElementById('authToggle').onclick=function(){
  authMode=authMode==='signin'?'signup':'signin';
  document.getElementById('authH3').textContent=authMode==='signin'?'👤 登录':'📝 注册';
  document.getElementById('authSubmit').textContent=authMode==='signin'?'登录':'注册并登录';
  this.textContent=authMode==='signin'?'没有账号？点此注册 →':'已有账号？点此登录 →';
};
document.getElementById('authSubmit').onclick=async function(){
  const email=document.getElementById('authEmail').value.trim();
  const pwd=document.getElementById('authPwd').value;
  const msg=document.getElementById('authMsg');
  if(!email||pwd.length<6){msg.textContent='请填邮箱，密码至少6位';return;}
  this.disabled=true;msg.textContent='请稍候…';
  try{
    let r,d;
    if(authMode==='signup'){
      r=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
      d=await r.json();
      if(!r.ok){msg.textContent=d.msg||'注册失败';return;}
      if(d.access_token){setAuth(d);}else{msg.textContent='注册成功！请到邮箱点确认链接后再登录';return;}
    }else{
      r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
      d=await r.json();
      if(!r.ok){msg.textContent=d.msg||'登录失败，检查邮箱密码';return;}
      setAuth(d);
    }
    document.getElementById('authMask').classList.remove('show');
    paintUser();await syncFav();
  }catch(e){msg.textContent='网络错误，请重试';}finally{this.disabled=false;}
};
function paintUser(){
  const a=getAuth(),b=document.getElementById('userBtn');
  if(a){b.textContent='👤✓';b.classList.add('on');b.title='已登录：'+(a.user&&a.user.email||'')+'（点此退出）';}
  else{b.textContent='👤';b.classList.remove('on');b.title='登录/云同步';}
}
async function syncFav(){
  const tok=authBearer();if(!tok){render();return;}
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/favorites?select=slug',{headers:authHdr()});
    if(!r.ok){render();return;}
    const srv=(await r.json()).map(x=>x.slug);
    const local=getFav();
    const toPush=local.filter(s=>!srv.includes(s));
    setFav([...new Set([...srv,...local])]);
    for(const s of toPush){await fetch(SUPABASE_URL+'/rest/v1/favorites',{method:'POST',headers:{...authHdr(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({slug:s})}).catch(()=>{});}
    render();
  }catch(e){render();}
}
function slugOf(t){return t.slug||(t.path||'').replace(/\//g,'')}
let APPS=[], MODE='new', Q='', CAT='全部', CATS=[], serverVotes={}, serverReady=false;
function metric(s){const v=serverVotes[s];if(!v)return 0;
  if(MODE==='week')return v.week||0; if(MODE==='month')return v.month||0; return v.total||0;}
function viewCnt(s){const v=serverVotes[s];return v?(v.views_total||0):0;}
function totalVotes(){
  if(serverReady) return Object.values(serverVotes).reduce((a,b)=>a+(b.total||0),0);
  return Object.values(getVotes()).reduce((a,b)=>a+(b||0),0);
}
async function loadServer(){
  if(!ANON_KEY) return;
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/votes?select=slug,total,week,month,views_total',{headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY}});
    if(!r.ok) return;
    (await r.json()).forEach(x=>serverVotes[x.slug]=x);
    serverReady=true;
  }catch(e){}
}

/* ---- 渲染 ---- */
function buildCats(){
  const box=document.getElementById('cats');
  box.innerHTML=CATS.map(c=>{
    const n=c.key==='全部'?APPS.length:APPS.filter(t=>(t.category||'办公')===c.key).length;
    return `<div class="cat${CAT===c.key?' on':''}" data-c="${c.key}">${c.icon} ${c.key}<span class="n">${n}</span></div>`;
  }).join('');
  box.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{CAT=el.dataset.c;buildCats();render();});
}
function render(){
  const favs=getFav(), liked=getLiked();
  document.getElementById('cnt').textContent=APPS.length;
  document.getElementById('vcnt').textContent=totalVotes();
  let list=APPS.filter(t=>{
    if(MODE==='fav'&&!favs.includes(slugOf(t)))return false;
    if(CAT!=='全部'&&(t.category||'办公')!==CAT)return false;
    if(!Q)return true;
    const hay=(t.name+' '+(t.keywords||[]).join(' ')+' '+(t.desc||'')).toLowerCase();
    return hay.includes(Q.toLowerCase());
  });
  if(MODE!=='new'&&MODE!=='fav') list=list.slice().sort((a,b)=>metric(slugOf(b))-metric(slugOf(a)));
  const hotBox=document.getElementById('hot');
  if(MODE==='week'||MODE==='month'||MODE==='total'){
    const ranked=APPS.map(t=>({t,c:metric(slugOf(t))})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
    if(ranked.length){
      document.getElementById('hotTitle').textContent=T('hot')[MODE];
      document.getElementById('hotRow').innerHTML=ranked.map((x,i)=>{
        const t=x.t;
        return `<a class="hot-card" href="${t.path}" target="_blank" rel="noopener">
          <div class="rk">#${i+1}</div><div class="nm">${t.icon||'🛠️'} ${t.name}</div>
          <div class="vt">👍 ${x.c} · 👁 ${viewCnt(slugOf(t))}</div></a>`;
      }).join('');
      hotBox.classList.add('show');
    } else hotBox.classList.remove('show');
  } else hotBox.classList.remove('show');
  const g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty">'+(MODE==='fav'?T('nofav'):T('empty'))+'</div>';return;
  }
  g.innerHTML='';
  list.forEach((t,i)=>{
    const s=slugOf(t), favF=favs.includes(s), likedF=liked.includes(s);
    const a=document.createElement('a');a.className='tool';a.href=t.path;a.target='_blank';a.rel='noopener';
    a.style.animationDelay=(i*0.03)+'s';
    a.innerHTML=`<div class="top"><div class="ic">${t.icon||'🛠️'}</div><div class="nm">${t.name}</div></div>
      <div class="ds">${t.desc||''}</div>
      <div class="kw">${(t.keywords||[]).join(' · ')||''}</div>
      <div class="bot">
        <button class="act like${likedF?' on':''}" data-slug="${s}" title="Like">👍<span>${metric(s)||''}</span></button>
        <button class="act fav${favF?' on':''}" data-slug="${s}" title="Favorite">⭐</button>
        <button class="act sh" data-slug="${s}" title="Share">↗</button>
        <span class="views">👁 ${viewCnt(s)||0}</span>
      </div>`;
    g.appendChild(a);
  });
}

/* ---- 点赞 ---- */
async function like(s){
  const liked=getLiked();
  if(liked.includes(s)) return;
  liked.push(s); setLiked(liked);
  if(serverReady){
    render();
    try{
      await fetch(SUPABASE_URL+'/rest/v1/rpc/increment_vote',{method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_slug:s})});
      const r=await fetch(SUPABASE_URL+'/rest/v1/votes?select=total,week,month,views_total&slug=eq.'+encodeURIComponent(s),{headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY}});
      const rows=await r.json(); if(rows[0]) serverVotes[s]=rows[0];
    }catch(e){}
    render();
  } else {
    const v=getVotes(); v[s]=(v[s]||0)+1; setVotes(v); render();
  }
}
async function toggleFav(s){
  const f=getFav(), i=f.indexOf(s);
  const adding=i<0;
  if(adding)f.push(s);else f.splice(i,1);
  setFav(f);render();
  const tok=authBearer();
  if(tok){
    try{
      if(adding) await fetch(SUPABASE_URL+'/rest/v1/favorites',{method:'POST',headers:{...authHdr(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({slug:s})});
      else await fetch(SUPABASE_URL+'/rest/v1/favorites?slug=eq.'+encodeURIComponent(s),{method:'DELETE',headers:authHdr()});
    }catch(e){}
  }
}

/* ---- 分享海报（Canvas 生成图 + 二维码，图上带站点介绍，扫码直达）---- */
function qrUrl(u){return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+encodeURIComponent(u);}
let shareCtx=null;
function openShare(t){
  const s=slugOf(t), url=SITE+(t.path||s+'/');
  shareCtx={t:t,url:url};
  const mask=document.getElementById('shareMask');
  mask.classList.add('show');
  const W=750,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const grd=x.createLinearGradient(0,0,W,H);
  grd.addColorStop(0,'#eef1ff');grd.addColorStop(1,'#fdeef6');
  x.fillStyle=grd;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();};
  rr(50,50,W-100,H-100,36);
  x.textAlign='center';
  x.font='150px serif';x.fillText(t.icon||'🛠️',W/2,240);
  x.fillStyle='#23263a';x.font='bold 52px -apple-system,PingFang SC,sans-serif';
  x.fillText((t.name||'').slice(0,16),W/2,350);
  x.fillStyle='#8a8fb0';x.font='30px -apple-system,PingFang SC,sans-serif';
  const desc=(t.desc||'').slice(0,40);
  x.fillText(desc.slice(0,20),W/2,420);x.fillText(desc.slice(20),W/2,465);
  x.fillStyle='#5b6bff';x.font='bold 34px -apple-system,PingFang SC,sans-serif';
  x.fillText(LANG==='zh'?'🧰 我的工具箱 · 每天自动上新的免费小工具':'🧰 My Toolbox · Free mini-tools, new daily',W/2,545);
  const q=new Image();q.crossOrigin='anonymous';
  q.onload=()=>{x.fillStyle='#fff';rr(W/2-140,590,280,280,24);
    x.drawImage(q,W/2-120,610,240,240);
    x.fillStyle='#b6bad0';x.font='24px sans-serif';x.fillText('扫码直达 · Scan to open',W/2,920);
    try{document.getElementById('posterImg').src=c.toDataURL('image/png');}
    catch(e){document.getElementById('posterImg').removeAttribute('src');
      document.getElementById('posterImg').outerHTML='<div id="posterImg" style="text-align:center"><img src="'+q.src+'" style="width:200px"><p style="font-size:12px;color:#8a8fb0">'+(t.icon||'')+' '+t.name+'<br>'+T('intro')+'</p></div>';}
  };
  q.onerror=()=>{document.getElementById('posterImg').outerHTML='<div id="posterImg" style="text-align:center"><p style="font-size:13px;color:#8a8fb0">'+(t.icon||'')+' '+t.name+'</p><p style="font-size:12px;color:#5b6bff;word-break:break-all">'+url+'</p></div>';};
  q.src=qrUrl(url);
}
document.getElementById('grid').addEventListener('click',e=>{
  const lk=e.target.closest('.like'), fv=e.target.closest('.fav'), sh=e.target.closest('.sh');
  if(lk){e.preventDefault();e.stopPropagation();like(lk.dataset.slug);return;}
  if(fv){e.preventDefault();e.stopPropagation();toggleFav(fv.dataset.slug);return;}
  if(sh){e.preventDefault();e.stopPropagation();
    const t=APPS.find(x=>slugOf(x)===sh.dataset.slug);if(t)openShare(t);return;}
});
document.getElementById('btnCopy').addEventListener('click',async()=>{
  if(!shareCtx)return;
  try{await navigator.clipboard.writeText(shareCtx.url);alert(T('copied'));}
  catch(e){prompt('',shareCtx.url);}
});
document.getElementById('btnSave').addEventListener('click',()=>{
  const img=document.getElementById('posterImg');
  if(img.tagName==='IMG'&&img.src){const a=document.createElement('a');a.href=img.src;a.download='toolbox-share.png';a.click();}
});
document.getElementById('q').addEventListener('input',e=>{Q=e.target.value.trim();render()});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');MODE=t.dataset.mode;render();
}));

const PAY={wechat:'',alipay:''};
let payPlan=localStorage.getItem('h5hub_plan')||'year', payWx=true;
function paintPay(){
  document.getElementById('payH3').textContent=T('pay_title');
  document.getElementById('payPlans').innerHTML=
    '<div class="payPlan'+(payPlan==='year'?' on':'')+'" data-p="year"><b>'+T('pay_year')+'</b><span>'+T('pay_year_lbl')+'</span></div>'+
    '<div class="payPlan'+(payPlan==='life'?' on':'')+'" data-p="life"><b>'+T('pay_life')+'</b><span>'+T('pay_life_lbl')+'</span></div>';
  document.getElementById('payTabs').innerHTML=
    '<button class="wx'+(payWx?' on':'')+'" data-w="wx">'+T('pay_wx')+'</button><button class="ali'+(payWx?'':' on')+'" data-w="ali">'+T('pay_ali')+'</button>';
  const src=payWx?PAY.wechat:PAY.alipay;
  document.getElementById('payQr').innerHTML=src?'<img src="'+src+'">':'<div style="font-size:12px;color:var(--muted)">'+T('pay_qr')+'</div>';

  document.getElementById('payHint').textContent=T('pay_hint');
}
document.getElementById('payPlans').addEventListener('click',e=>{const p=e.target.closest('.payPlan');if(!p)return;payPlan=p.dataset.p;localStorage.setItem('h5hub_plan',payPlan);paintPay();});

document.getElementById('payX').onclick=()=>document.getElementById('payMask').classList.remove('show');
document.getElementById('payMask').addEventListener('click',e=>{if(e.target.id==='payMask')e.currentTarget.classList.remove('show');});
document.getElementById('vipBtn').onclick=function(){if(localStorage.getItem('h5hub_pro')==='1'){alert(LANG==='zh'?'已是会员，感谢支持！':'Already a member, thanks!');return;}paintPay();document.getElementById('payMask').classList.add('show');};

fetch('./manifest.json').then(r=>r.json()).then(m=>{
  APPS=m.apps||FALLBACK;CATS=m.categories||[{key:'全部',icon:'🧩'}];

}).catch(()=>{APPS=FALLBACK;CATS=[{key:'全部',icon:'🧩'}];buildCats();applyLang();paintUser();loadServer().then(syncFav)});
