/* ---------- wheel ---------- */
var cv=document.getElementById("wheel"), ctx=cv.getContext("2d");
function drawWheel(){
  var dpr=Math.min(window.devicePixelRatio||1,2), size=600;
  cv.width=size*dpr; cv.height=size*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  var n=items.length; if(!n){ctx.fillStyle="#e8eaf3";ctx.beginPath();ctx.arc(300,300,300,0,7);ctx.fill();return;}
  var seg=2*Math.PI/n, R=296;
  for(var i=0;i<n;i++){
    var a0=i*seg-Math.PI/2, a1=a0+seg;
    ctx.beginPath(); ctx.moveTo(300,300); ctx.arc(300,300,R,a0,a1); ctx.closePath();
    ctx.fillStyle=colorOf(i); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.translate(300,300); ctx.rotate(a0+seg/2);
    ctx.fillStyle="#fff"; ctx.textAlign="right"; ctx.textBaseline="middle";
    var fs = n<=6?30 : n<=12?24 : n<=20?19 : 15;
    ctx.font="700 "+fs+"px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
    var txt=items[i].n; if(txt.length>9) txt=txt.slice(0,9)+"…";
    ctx.shadowColor="rgba(0,0,0,.28)"; ctx.shadowBlur=3;
    ctx.fillText(txt, R-22, 0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(300,300,R,0,7); ctx.lineWidth=6; ctx.strokeStyle="#fff"; ctx.stroke();
}
function pickByWeight(){
  var pool=items.map(function(it,i){return {i:i,w:Math.max(1,parseInt(it.w||1,10))};}).filter(function(p){return !pickedSet[items[p.i].n];});
  if(!pool.length) return -1;
  var total=pool.reduce(function(a,b){return a+b.w;},0), r=Math.random()*total;
  for(var k=0;k<pool.length;k++){ r-=pool[k].w; if(r<=0) return pool[k].i; }
  return pool[pool.length-1].i;
}
function spin(){
  if(spinning) return;
  if(items.length<2){toast(tr("needTwo"));return;}
  var idx=pickByWeight();
  if(idx<0){toast(tr("allDone"));return;}
  var n=items.length, seg=360/n, turns=Math.max(1,Math.min(12,parseInt(document.getElementById("optTurns").value,10)||5));
  var jitter=(Math.random()-.5)*seg*0.68;
  var target=360*turns - (idx+0.5)*seg + jitter;
  rotation += (target - (rotation%360)) + 360;
  spinning=true;
  var g=document.getElementById("goBtn"); g.disabled=true;
  if(document.getElementById("optSound").checked) tickSound(turns);
  cv.style.transition="transform 4.6s cubic-bezier(.15,.72,.06,1)";
  cv.style.transform="rotate("+rotation+"deg)";
  setTimeout(function(){
    spinning=false; g.disabled=false;
    var it=items[idx];
    if(document.getElementById("optRemove").checked){ pickedSet[it.n]=1; }
    addHist(mode==="wheel"?tr("modeWheel"):tr("modePick"), it.n);
    save(); renderItems(); renderDaily(); drawWheel();
    if(document.getElementById("optSound").checked) winSound();
    toast("🎉 "+it.n);
  },4700);
}
function doPick(){
  var idx=pickByWeight();
  if(idx<0){document.getElementById("pickVal").textContent=tr("allDone");toast(tr("allDone"));return;}
  var it=items[idx];
  if(document.getElementById("optRemove").checked) pickedSet[it.n]=1;
  document.getElementById("pickVal").textContent=it.n;
  var remain=items.filter(function(x){return !pickedSet[x.n];}).length;
  document.getElementById("pickMeta").textContent=tr("total")+" "+items.length+" · "+tr("noLucky")+" "+remain;
  addHist(tr("modePick"), it.n); save(); renderItems(); renderDaily(); drawWheel();

}

function beep(f,d,v){ var a=actx(); if(!a) return; var o=a.createOscillator(),g=a.createGain();
  o.type="square";o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(a.destination);o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);o.stop(a.currentTime+d); }
function tickSound(t){ var c=Math.round(t*6), i=0; (function step(){ if(i++>c) return; beep(880,0.05,0.035); setTimeout(step,Math.max(70,4200/c)); })(); }

/* ---------- init ---------- */
(function init(){

  var saved=null; try{saved=localStorage.getItem("lw_lang");}catch(e){}

})();
window.addEventListener("resize",function(){ clearTimeout(window.__rz); window.__rz=setTimeout(drawWheel,200); });
})();

  } else loadCnt();

    x.fillText('免登录 · 即开即用 · 欢迎点赞评论',W/2,370);

    q.onload=function(){x.fillStyle='#fff';rr(W/2-140,420,280,280,24);x.drawImage(q,W/2-120,440,240,240);
