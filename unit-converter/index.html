<title>单位换算器 - 长度/重量/温度/面积/体积/数据一键换算</title>
<meta name="description" content="免费在线单位换算工具，支持长度、重量、温度、面积、体积、时间、速度、数据存储等常用单位实时换算，零依赖、秒出结果。">
<style>
:root{
  --bg1:#0f2027;--bg2:#134e4a;--bg3:#06b6d4;
  --accent:#2dd4bf;--accent2:#34d399;--accent-soft:rgba(45,212,191,.14);
  --text:#e6fffb;--muted:#94e6df;--card:rgba(255,255,255,.06);
  --border:rgba(45,212,191,.28);--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;padding:24px 16px 48px;
}
.wrap{max-width:640px;margin:0 auto}
header{text-align:center;margin-bottom:22px;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);font-size:13px;cursor:pointer;transition:.25s;backdrop-filter:blur(6px)}
.tab:hover{transform:translateY(-2px);color:var(--text)}
.tab.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#062b27;border-color:transparent;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.row .field{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(0,0,0,.2);color:var(--text);font-size:16px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.swap{align-self:flex-end;flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--accent-soft);color:var(--accent);font-size:18px;cursor:pointer;transition:.25s}
.swap:hover{transform:rotate(180deg) scale(1.05);background:var(--accent);color:#062b27}
.result{margin-top:6px;padding:18px;border-radius:14px;background:linear-gradient(90deg,var(--accent-soft),transparent);
  border:1px dashed var(--border);text-align:center}
.result .val{font-size:30px;font-weight:800;color:var(--accent);word-break:break-all;transition:.2s}
.result .unit{font-size:14px;color:var(--muted);margin-left:6px}
.all{margin-top:18px}
.all h3{font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:600}
.all table{width:100%;border-collapse:collapse;font-size:14px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>单位换算器</h1>
    <div class="sub">长度 · 重量 · 温度 · 面积 · 体积 · 时间 · 速度 · 数据，实时换算</div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="row">
      <div class="field">
        <label>从</label>
        <select id="from"></select>
      </div>
      <button class="swap" id="swap" title="互换">⇄</button>
      <div class="field">
        <label>到</label>
        <select id="to"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>输入数值</label>
        <input id="val" type="number" value="1" step="any" placeholder="输入数值">
      </div>
    </div>
    <div class="result">
      <span class="val" id="out">—</span><span class="unit" id="outUnit"></span>
    </div>
    <div class="all">
      <h3>全部单位对照（当前数值）</h3>
      <table id="allTable"></table>
    </div>
  </div>
  <div class="foot">纯前端运行 · 数据不出本机 · 建议收藏备用</div>
</div>
<script>
const CATS = {
  length:{name:'长度',units:{'米 m':1,'厘米 cm':0.01,'毫米 mm':0.001,'千米 km':1000,'英寸 in':0.0254,'英尺 ft':0.3048,'英里 mi':1609.344,'码 yd':0.9144}},
  weight:{name:'重量',units:{'千克 kg':1,'克 g':0.001,'毫克 mg':1e-6,'吨 t':1000,'斤':0.5,'两':0.05,'盎司 oz':0.0283495,'磅 lb':0.453592}},
  temp:{name:'温度',special:true,units:{'摄氏度 °C':1,'华氏度 °F':1,'开尔文 K':1}},
  area:{name:'面积',units:{'平方米 m²':1,'平方厘米 cm²':1e-4,'平方千米 km²':1e6,'亩':666.667,'公顷 ha':10000,'平方英尺 ft²':0.092903,'英亩 ac':4046.86}},
  volume:{name:'体积',units:{'升 L':1,'毫升 mL':0.001,'立方米 m³':1000,'加仑(美) gal':3.78541,'杯 cup':0.236588,'茶匙 tsp':0.00492892}},
  time:{name:'时间',units:{'秒 s':1,'毫秒 ms':0.001,'分钟 min':60,'小时 h':3600,'天 d':86400,'周 wk':604800}},
  speed:{name:'速度',units:{'米/秒 m/s':1,'千米/时 km/h':0.277778,'英里/时 mph':0.44704,'节 kn':0.514444}},
  data:{name:'数据',units:{'字节 B':1,'千字节 KB':1024,'兆字节 MB':1048576,'吉字节 GB':1073741824,'太字节 TB':1099511627776}}
};
let cur = 'length';
const $ = id => document.getElementById(id);
function toC(v,u){return u==='华氏度 °F'?(v-32)*5/9:u==='开尔文 K'?v-273.15:v;}
function fromC(c,u){return u==='华氏度 °F'?c*9/5+32:u==='开尔文 K'?c+273.15:c;}
function convert(v,cat,f,t){
  const d=CATS[cat];
  if(d.special){const c=toC(v,f);return fromC(c,t);}
  const base=v*d.units[f];return base/d.units[t];
}
function renderTabs(){
  $('tabs').innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement('div');
    b.className='tab'+(k===cur?' on':'');b.textContent=v.name;
    b.onclick=()=>{cur=k;renderTabs();renderSelects();calc();};
    $('tabs').appendChild(b);
  });
}
function renderSelects(){
  const units=Object.keys(CATS[cur].units);
  $('from').innerHTML=units.map(u=>`<option>${u}</option>`).join('');
  $('to').innerHTML=units.map(u=>`<option>${u}</option>`).join('');
  if(cur==='temp'){$('to').selectedIndex=1;}else{$('to').selectedIndex=1;}
}
function calc(){
  const v=parseFloat($('val').value);
  const f=$('from').value,t=$('to').value;
  const out=$('out');
  if(isNaN(v)){out.textContent='—';$('outUnit').textContent='';renderAll(NaN);return;}
  const r=convert(v,cur,f,t);
  out.textContent = (Math.abs(r)>=1e9||(Math.abs(r)<1e-4&&r!==0))?r.toExponential(4):(Math.round(r*1e6)/1e6).toLocaleString('zh-CN');
  $('outUnit').textContent=t.split(' ')[0];
  renderAll(v);
}
function renderAll(v){
  const units=Object.keys(CATS[cur].units);
  const tbl=$('allTable');
  if(isNaN(v)){tbl.innerHTML='';return;}
  tbl.innerHTML=units.map(u=>{
    const r=convert(v,cur,u,u===CATS[cur].units?u:u);
    const val = (cur==='temp')? convert(v,cur,$('from').value,u) : v*CATS[cur].units[u]/CATS[cur].units[$('from').value];
    const disp=(Math.abs(val)>=1e9||(Math.abs(val)<1e-4&&val!==0))?val.toExponential(3):(Math.round(val*1e6)/1e6).toLocaleString('zh-CN');
    return `<tr><td>${u}</td><td>${disp}</td></tr>`;
  }).join('');
}
$('swap').onclick=()=>{const f=$('from').value;$('from').value=$('to').value;$('to').value=f;calc();};
$('val').oninput=calc;$('from').onchange=calc;$('to').onchange=calc;
renderTabs();renderSelects();calc();
</script>

        fetch(SB+'/rest/v1/comments',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json',Prefer:'return=minimal'},
          body:JSON.stringify({slug:slug,name:n,body:b})})
        .then(function(r){if(!r.ok)throw 0;cmMask.querySelector('#wbCmBody').value='';loadCm();})
        .catch(function(){alert('发表失败，请稍后再试')}).finally(function(){this.disabled=false}.bind(this));
      };
    }
    cmMask.classList.add('show');loadCm();
  };
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function loadCm(){
    if(!cmMask)return;
    fetch(SB+'/rest/v1/comments?select=name,body,created_at&slug=eq.'+encodeURIComponent(slug)+'&order=created_at.desc&limit=50',{headers:{apikey:ANON,Authorization:'Bearer '+ANON}})
    .then(function(r){return r.json()}).then(function(rows){
      var box=cmMask.querySelector('#wbCmList');
      box.innerHTML=rows.length?rows.map(function(c){
        var d=new Date(c.created_at),ds=(d.getMonth()+1)+'/'+d.getDate();
        return '<div class="wbItem"><b>'+esc(c.name)+'</b> <i>'+ds+'</i><span>'+esc(c.body)+'</span></div>';
      }).join(''):'<div style="font-size:12px;color:#8a8fb0;padding:10px 0">还没有评论，来抢沙发～</div>';
      var n=rows.length; if(n)bar.querySelector('.cc').textContent=' '+n;
    }).catch(function(){});
  }
  loadCm();

  /* ---------- 付费墙：免费 ' + PAY.free + ' 次后硬封锁（不可用第 ' + (PAY.free+1) + ' 次）---------- */
  var use=JSON.parse(localStorage.getItem('h5hub_use')||'{}');
  if(!sessionStorage.getItem('wb_use_'+slug)){use[slug]=(use[slug]||0)+1;localStorage.setItem('h5hub_use',JSON.stringify(use));}
  var used=use[slug]||0, isPro=localStorage.getItem('h5hub_pro')==='1';
  var free=document.createElement('div');free.id='wbFree';document.body.appendChild(free);
  function paintFree(){free.textContent=isPro?'✨ 会员已解锁 · 感谢支持':(used>PAY.free?'🔒 已达免费上限，点💎解锁':'🆓 免费额度剩 '+Math.max(0,PAY.free-used+1)+' 次');}
  paintFree();
  bar.querySelector('.vip').onclick=function(){ if(isPro){alert('✨ 你已是会员，感谢支持！');return;} showPay(); };
  function showPay(){
    if(isPro)return;
    var m=mkMask('wbPay','🔒 免费额度已用完 · 解锁全部工具',false);
    var plan_wx=true;
    function paint(){
      var plan=localStorage.getItem('wb_plan')||'year';
      m.querySelector('.bd').innerHTML=
        '<div style="font-size:12.5px;color:#8a8fb0">你已免费使用 '+PAY.free+' 次。解锁后无限次使用本站全部工具（含每日新增）。</div>'+
        '<div class="wbPlans"><div class="wbPlan'+(plan==='year'?' on':'')+'" data-p="year"><b>'+PAY.year+'</b><span>年度会员</span></div>'+
        '<div class="wbPlan'+(plan==='life'?' on':'')+'" data-p="life"><b>'+PAY.life+'</b><span>永久买断 · 更划算</span></div></div>'+
        '<div class="wbPayTabs"><button class="wx'+(plan_wx?' on':'')+'" data-w="wx">微信支付</button><button class="ali'+(plan_wx?'':' on')+'" data-w="ali">支付宝</button></div>'+
        '<div class="wbQrBox" id="wbQr"></div>'+
        '<button class="wbBtn" id="wbPaid" style="width:100%;margin-top:10px">✅ 我已完成支付，激活会员</button>'+
        '<div style="font-size:10.5px;color:#b6bad0;margin-top:6px;text-align:center">支付后点击激活（试运行阶段自动开通；如遇问题请截图联系站长）</div>';
      m.querySelectorAll('.wbPlan').forEach(function(p){p.onclick=function(){localStorage.setItem('wb_plan',p.dataset.p);paint();}});
      m.querySelectorAll('.wbPayTabs button').forEach(function(b){b.onclick=function(){plan_wx=b.dataset.w==='wx';paint();};});
      var qrEl=m.querySelector('#wbQr'),src=plan_wx?PAY.wechat:PAY.alipay;
      qrEl.innerHTML=src?'<div><img src="'+src+'"><div style="font-size:11px;color:#8a8fb0;margin-top:4px">长按 / 扫码支付 '+(plan==='year'?PAY.year:PAY.life)+'</div></div>'
        :'<div style="font-size:12px;color:#8a8fb0">收款码配置中<br><br>↑ 微信 / 支付宝扫码后<br>向站长转账对应金额即可</div>';
      m.querySelector('#wbPaid').onclick=function(){localStorage.setItem('h5hub_pro','1');isPro=true;unblur();m.classList.remove('show');paintFree();alert('🎉 解锁成功，感谢支持！');};
    };
    paint();m.classList.add('show');
  }
  function blurPage(){document.body.classList.add('wbBlur');}
  function unblur(){document.body.classList.remove('wbBlur');}
  if(!isPro&&used>PAY.free){blurPage();showPay();}
})();
</script>

</body>
</html>
