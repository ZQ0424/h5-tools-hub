// Base64 支持 UTF-8
function b64Encode(str){return btoa(unescape(encodeURIComponent(str)));}
function b64Decode(str){return decodeURIComponent(escape(atob(str.trim())));}
// MD5 实现（纯 JS）
function md5(str){
  function rl(n,c){return (n<<c)|(n>>>(32-c));}
  function add(x,y){const l=(x&0xFFFF)+(y&0xFFFF);const m=(x>>16)+(y>>16)+(l>>16);return (m<<16)|(l&0xFFFF);}

  function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cmn(c^(b|(~d)),a,b,x,s,t);}

    a=hh(a,b,c,d,words[i+5],4,-378558);d=hh(d,a,b,c,words[i+8],11,-2022574463);c=hh(c,d,a,b,words[i+11],16,1839030562);b=hh(b,c,d,a,words[i+14],23,-35309556);

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('go').onclick=async()=>{
  const input=document.getElementById('input').value;
  const out=document.getElementById('out');
  try{
    if(mode==='b64e')out.textContent=b64Encode(input);
    else if(mode==='b64d')out.textContent=b64Decode(input);
    else if(mode==='urle')out.textContent=encodeURIComponent(input);
    else if(mode==='urld')out.textContent=decodeURIComponent(input);
    else if(mode==='md5')out.textContent=md5(input);
    else if(mode==='sha256')out.textContent=await sha256(input);
  }catch(e){out.textContent=T('err');}
};
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert(T('copied')));};
document.querySelectorAll('[data-i]').forEach(el=>{const v=T(el.dataset.i);if(v&&el.tagName!=='TEXTAREA')el.textContent=v;else if(v)el.placeholder=v;});

    x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff';
    function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
    rr(50,50,W-100,H-100,36);x.textAlign='center';
    x.fillStyle='#23263a';x.font='bold 54px -apple-system,PingFang SC,sans-serif';
    x.fillText(toolName.slice(0,14),W/2,230);
    x.fillStyle='#5b6bff';x.font='bold 34px -apple-system,PingFang SC,sans-serif';
    x.fillText('🧰 我的工具箱 · 每天自动上新的免费小工具',W/2,310);
    x.fillStyle='#8a8fb0';x.font='28px -apple-system,PingFang SC,sans-serif';
    x.fillText('免登录 · 即开即用 · 欢迎点赞评论',W/2,370);
    var q=new Image();q.crossOrigin='anonymous';
    q.onload=function(){x.fillStyle='#fff';rr(W/2-140,420,280,280,24);x.drawImage(q,W/2-120,440,240,240);
      x.fillStyle='#5b6bff';x.font='bold 30px sans-serif';x.fillText('👍 觉得好用就点个赞',W/2,790);
      x.fillStyle='#b6bad0';x.font='24px sans-serif';x.fillText('扫码直达 · Scan to open',W/2,860);
      try{bd.querySelector('img').src=c.toDataURL('image/png');}
      catch(e){bd.querySelector('img').outerHTML='<div style="text-align:center"><img src="'+q.src+'" style="width:180px"></div>';}
    };
    q.src=qr(url);
    bd.querySelector('#wbCp').onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){alert('链接已复制')}).catch(function(){prompt('',url)});};
    bd.querySelector('#wbSv').onclick=function(){var im=bd.querySelector('img');if(im.src&&im.src.indexOf('data:')===0){var a=document.createElement('a');a.href=im.src;a.download='share.png';a.click();}else alert('请长按图片保存');};
    m.classList.add('show');
  };

  /* ---------- 评论区 ---------- */
  var cmMask=null;
  bar.querySelector('.cm').onclick=function(){
    if(!cmMask){
      cmMask=mkMask('wbCmMask','💬 对「'+toolName+'」说点什么');
      cmMask.querySelector('.bd').innerHTML=
        '<div id="wbCmList" style="max-height:44vh;overflow:auto"><div style="font-size:12px;color:#8a8fb0">加载中…</div></div>'+
        '<div class="wbCm"><input id="wbCmName" placeholder="昵称（可留空）" maxlength="20"></div>'+
        '<div class="wbCm"><textarea id="wbCmBody" placeholder="使用感受 / 建议 / 想要的新功能…" maxlength="500"></textarea></div>'+
        '<button class="wbBtn" id="wbCmSend" style="width:100%">发 表</button>';
      cmMask.querySelector('#wbCmSend').onclick=function(){
        var b=cmMask.querySelector('#wbCmBody').value.trim();
        if(!b)return alert('写点内容再发表吧');
        var n=cmMask.querySelector('#wbCmName').value.trim()||'访客';
        this.disabled=true;
        fetch(SB+'/rest/v1/comments',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json',Prefer:'return=minimal'},
          body:JSON.stringify({slug:slug,name:n,body:b})})
        .then(function(r){if(!r.ok)throw 0;cmMask.querySelector('#wbCmBody').value='';loadCm();})
        .catch(function(){alert('发表失败，请稍后再试')}).finally(function(){this.disabled=false}.bind(this));
      };
    }
    cmMask.classList.add('show');loadCm();
  };
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function loadCm(){
    if(!cmMask)return;
    fetch(SB+'/rest/v1/comments?select=name,body,created_at&slug=eq.'+encodeURIComponent(slug)+'&order=created_at.desc&limit=50',{headers:{apikey:ANON,Authorization:'Bearer '+ANON}})
    .then(function(r){return r.json()}).then(function(rows){
      var box=cmMask.querySelector('#wbCmList');
      box.innerHTML=rows.length?rows.map(function(c){
        var d=new Date(c.created_at),ds=(d.getMonth()+1)+'/'+d.getDate();
        return '<div class="wbItem"><b>'+esc(c.name)+'</b> <i>'+ds+'</i><span>'+esc(c.body)+'</span></div>';
      }).join(''):'<div style="font-size:12px;color:#8a8fb0;padding:10px 0">还没有评论，来抢沙发～</div>';
      var n=rows.length; if(n)bar.querySelector('.cc').textContent=' '+n;
    }).catch(function(){});
  }
  loadCm();

  /* ---------- 付费墙：免费 ' + PAY.free + ' 次后硬封锁（不可用第 ' + (PAY.free+1) + ' 次）---------- */
  var use=JSON.parse(localStorage.getItem('h5hub_use')||'{}');
  if(!sessionStorage.getItem('wb_use_'+slug)){use[slug]=(use[slug]||0)+1;localStorage.setItem('h5hub_use',JSON.stringify(use));}
  var used=use[slug]||0, isPro=localStorage.getItem('h5hub_pro')==='1';
  var free=document.createElement('div');free.id='wbFree';document.body.appendChild(free);
  function paintFree(){free.textContent=isPro?'✨ 会员已解锁 · 感谢支持':(used>PAY.free?'🔒 已达免费上限，点💎解锁':'🆓 免费额度剩 '+Math.max(0,PAY.free-used+1)+' 次');}
  paintFree();
  bar.querySelector('.vip').onclick=function(){ if(isPro){alert('✨ 你已是会员，感谢支持！');return;} showPay(); };
  function showPay(){
    if(isPro)return;
    var m=mkMask('wbPay','🔒 免费额度已用完 · 解锁后继续使用');
    var plan_wx=true;
    function paint(){
      var plan=localStorage.getItem('wb_plan')||'year';
      m.querySelector('.bd').innerHTML=
        '<div style="font-size:12.5px;color:#8a8fb0">你已免费使用 '+PAY.free+' 次。解锁后无限次使用本站全部工具（含每日新增）。</div>'+
        '<div class="wbPlans"><div class="wbPlan'+(plan==='year'?' on':'')+'" data-p="year"><b>'+PAY.year+'</b><span>年度会员</span></div>'+
        '<div class="wbPlan'+(plan==='life'?' on':'')+'" data-p="life"><b>'+PAY.life+'</b><span>永久买断 · 更划算</span></div></div>'+
        '<div class="wbPayTabs"><button class="wx'+(plan_wx?' on':'')+'" data-w="wx">微信支付</button><button class="ali'+(plan_wx?'':' on')+'" data-w="ali">支付宝</button></div>'+
        '<div class="wbQrBox" id="wbQr"></div>'+
        '<button class="wbBtn" id="wbPaid" style="width:100%;margin-top:10px">✅ 我已完成支付，激活会员</button>'+
        '<div style="font-size:10.5px;color:#b6bad0;margin-top:6px;text-align:center">支付后点击激活（试运行自动开通；如遇问题请截图联系站长）<br>可关闭本窗，但关闭后将无法继续使用本工具，点💎可重新解锁</div>';
      m.querySelectorAll('.wbPlan').forEach(function(p){p.onclick=function(){localStorage.setItem('wb_plan',p.dataset.p);paint();}});
      m.querySelectorAll('.wbPayTabs button').forEach(function(b){b.onclick=function(){plan_wx=b.dataset.w==='wx';paint();};});
      var qrEl=m.querySelector('#wbQr'),src=plan_wx?PAY.wechat:PAY.alipay;
      qrEl.innerHTML=src?'<div><img src="'+src+'"><div style="font-size:11px;color:#8a8fb0;margin-top:4px">长按 / 扫码支付 '+(plan==='year'?PAY.year:PAY.life)+'</div></div>'
        :'<div style="font-size:12px;color:#8a8fb0">收款码配置中<br><br>↑ 微信 / 支付宝扫码后<br>向站长转账对应金额即可</div>';
      m.querySelector('#wbPaid').onclick=function(){localStorage.setItem('h5hub_pro','1');isPro=true;unblur();m.classList.remove('show');paintFree();alert('🎉 解锁成功，感谢支持！');};
    };
    paint();m.classList.add('show');
  }
  function blurPage(){document.body.classList.add('wbBlur');}
  function unblur(){document.body.classList.remove('wbBlur');}
  if(!isPro&&used>PAY.free){blurPage();showPay();}
})();
</script>

</body>
</html>
