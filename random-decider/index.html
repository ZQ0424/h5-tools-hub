<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机决定 · 抽签 · 我的工具箱</title>
<meta name="description" content="在线随机数生成、抽签决定、抛硬币、转盘抽取，解决选择困难症，支持自定义范围，纯前端。">
<style>
:root{--bg1:#eef1ff;--bg2:#fdeef6;--card:#fff;--primary:#5b6bff;--primary-2:#ff6bb0;--text:#23263a;--muted:#8a8fb0;--line:#eef0f7;--radius:14px;--shadow:0 6px 20px rgba(91,107,255,.08)}
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);padding:16px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13px;font-weight:700;background:#f7f8ff;color:var(--muted);cursor:pointer;border:1px solid var(--line);min-width:60px}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.result{font-size:44px;font-weight:800;text-align:center;padding:30px;background:linear-gradient(135deg,#f6f7ff,#fdf0f6);border-radius:12px;margin:12px 0;min-height:100px;display:flex;align-items:center;justify-content:center;transition:.3s}
.result.big{font-size:52px;color:var(--primary)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:12px;color:var(--muted);white-space:nowrap}
.row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;outline:none}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.btn:active{transform:scale(.97)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;outline:none;resize:vertical;height:90px}
</style>
</head>
<body>
<div class="wrap">
  <h1 data-i="title">随机决定 · 抽签</h1>
  <div class="sub" data-i="sub">选择困难症克星 · 纯前端</div>
  <div class="card">
    <div class="tabs">
      <div class="tab on" data-m="num" data-i="m_num">随机数</div>
      <div class="tab" data-m="coin" data-i="m_coin">抛硬币</div>
      <div class="tab" data-m="draw" data-i="m_draw">抽签</div>
    </div>
    <div id="numFld">
      <div class="row"><label data-i="l_min">最小值</label><input id="min" type="number" value="1"></div>
      <div class="row"><label data-i="l_max">最大值</label><input id="max" type="number" value="100"></div>
    </div>
    <div id="drawFld" style="display:none">
      <textarea id="items" data-i="ph_items" placeholder="每行一个选项，例如：&#10;吃火锅&#10;吃烧烤&#10;吃日料"></textarea>
    </div>
    <div class="result" id="result">—</div>
    <button class="btn" id="go" data-i="go">开始</button>
  </div>
</div>
<script>
const I18N={zh:{title:'随机决定 · 抽签',sub:'选择困难症克星 · 纯前端',m_num:'随机数',m_coin:'抛硬币',m_draw:'抽签',l_min:'最小值',l_max:'最大值',ph_items:'每行一个选项，例如：\n吃火锅\n吃烧烤\n吃日料',go:'开始',empty:'请先填写选项'},
en:{title:'Random Decider',sub:'Beat choice paralysis',m_num:'Number',m_coin:'Coin',m_draw:'Draw',l_min:'Min',l_max:'Max',ph_items:'One option per line',go:'Go',empty:'Please add options first'}};
function T(k){return I18N.zh[k]||k;}
let mode='num';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');mode=t.dataset.m;document.getElementById('numFld').style.display=mode==='num'?'block':'none';document.getElementById('drawFld').style.display=mode==='draw'?'block':'none';});
document.getElementById('go').onclick=()=>{
  const r=document.getElementById('result');r.classList.remove('big');
  if(mode==='num'){
    const mn=+document.getElementById('min').value,mx=+document.getElementById('max').value;
    const v=Math.floor(Math.random()*(mx-mn+1))+mn;r.textContent=v;r.classList.add('big');
  }else if(mode==='coin'){
    const v=Math.random()<0.5?'正面':'反面';r.textContent=v;r.classList.add('big');
  }else{
    const items=document.getElementById('items').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!items.length){alert(T('empty'));return;}
    const v=items[Math.floor(Math.random()*items.length)];r.textContent=v;r.classList.add('big');
  }
};
</script>

  '.wbMask.show{display:flex}.wbSheet{background:#fff;border-radius:18px 18px 0 0;max-width:420px;width:100%;max-height:82vh;overflow:auto;padding:16px 16px 26px}'+
  '.wbSheet h3{margin:0 0 10px;font-size:15.5px}.wbX{float:right;border:none;background:none;font-size:17px;color:#8a8fb0;cursor:pointer}'+
  '.wbCm{display:flex;gap:6px;margin:6px 0}.wbCm input,.wbCm textarea{flex:1;border:1px solid #eef0f7;border-radius:10px;padding:8px 10px;font-size:13px;outline:none}.wbCm textarea{height:56px;resize:none}'+
  '.wbBtn{border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#5b6bff,#ff6bb0);color:#fff}'+
  '.wbBtn.g{background:#eef0ff;color:#5b6bff}'+
  '.wbItem{background:#f7f8ff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}.wbItem b{font-size:12px;color:#5b6bff}.wbItem span{display:block;color:#23263a;margin-top:2px;word-break:break-word}.wbItem i{font-size:10.5px;color:#b6bad0;font-style:normal}'+
  '.wbPoster{width:100%;border-radius:10px}'+
  '.wbPlans{display:flex;gap:8px;margin:10px 0}.wbPlan{flex:1;border:2px solid #eef0f7;border-radius:12px;padding:10px;text-align:center;cursor:pointer}.wbPlan.on{border-color:#5b6bff;background:#f6f7ff}.wbPlan b{display:block;font-size:17px;color:#ff6bb0}.wbPlan span{font-size:11px;color:#8a8fb0}'+
  '.wbPayTabs{display:flex;gap:6px;margin-bottom:8px}.wbPayTabs button{flex:1;border:1px solid #eef0f7;background:#fff;border-radius:10px;padding:8px;font-size:13px;font-weight:700;cursor:pointer}.wbPayTabs button.on{border-color:#25ab3a;color:#25ab3a}.wbPayTabs button.on.wx{border-color:#25ab3a;color:#25ab3a}.wbPayTabs button.on.ali{border-color:#1677ff;color:#1677ff}'+
  '.wbQrBox{text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;background:#f7f8ff;border-radius:12px;padding:10px}.wbQrBox img{width:160px;height:160px;border-radius:8px}'+
  '.wbBlur>*:not(#wbBar):not(#wbFree):not(.wbMask){filter:blur(6px);pointer-events:none;user-select:none}';
  document.head.appendChild(css);

  /* ---------- 底部工具条 ---------- */

    '<button class="cm" title="评论">💬<span class="cc"></span></button>'+

    '<span class="vw">👁 <span class="vcw">0</span></span>';

    var m=document.createElement('div');m.className='wbMask';m.id=id;
    m.innerHTML='<div class="wbSheet">'+(closable===false?'':'<button class="wbX">✕</button>')+'<h3>'+title+'</h3><div class="bd"></div></div>';
    if(closable!==false){
      m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show')});
      m.querySelector('.wbX').onclick=function(){m.classList.remove('show')};
    }
    document.body.appendChild(m);return m;}

  /* ---------- 浏览量 + 点赞数 ---------- */
  function loadCnt(){
    fetch(SB+'/rest/v1/votes?select=total,views_total&slug=eq.'+encodeURIComponent(slug),{headers:{apikey:ANON,Authorization:'Bearer '+ANON}})
    .then(function(r){return r.json()}).then(function(rows){
      if(rows[0]){bar.querySelector('.vc').textContent=rows[0].total||0;bar.querySelector('.vcw').textContent=rows[0].views_total||0;}
    }).catch(function(){});
  }
  if(!sessionStorage.getItem('wb_view_'+slug)){
    sessionStorage.setItem('wb_view_'+slug,'1');
    fetch(SB+'/rest/v1/rpc/increment_view',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify({p_slug:slug})}).then(loadCnt).catch(loadCnt);
  } else loadCnt();

  bar.querySelector('.lk').onclick=function(){
    if(liked())return; var a=ls('h5hub_liked');a.push(slug);save('h5hub_liked',a);

      else fetch(SB+'/rest/v1/favorites?slug=eq.'+encodeURIComponent(slug),{method:'DELETE',headers:{apikey:ANON,Authorization:'Bearer '+tok}}).catch(function(){});

  /* ---------- 分享海报（二维码 + 站点介绍，扫码直达） ---------- */

    var m=mkMask('wbShare','↗ 分享这个工具'),bd=m.querySelector('.bd');
    bd.innerHTML='<img class="wbPoster" alt="海报生成中…"><div style="display:flex;gap:8px;margin-top:10px">'+

    var url=SITE+slug+'/';
    var W=750,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');

    x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff';
    function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
    rr(50,50,W-100,H-100,36);x.textAlign='center';
    x.fillStyle='#23263a';x.font='bold 54px -apple-system,PingFang SC,sans-serif';
    x.fillText(toolName.slice(0,14),W/2,230);
    x.fillStyle='#5b6bff';x.font='bold 34px -apple-system,PingFang SC,sans-serif';
    x.fillText('🧰 我的工具箱 · 每天自动上新的免费小工具',W/2,310);

    x.fillText('免登录 · 即开即用 · 欢迎点赞评论',W/2,370);
    var q=new Image();q.crossOrigin='anonymous';
    q.onload=function(){x.fillStyle='#fff';rr(W/2-140,420,280,280,24);x.drawImage(q,W/2-120,440,240,240);
      x.fillStyle='#5b6bff';x.font='bold 30px sans-serif';x.fillText('👍 觉得好用就点个赞',W/2,790);

  bar.querySelector('.vip').onclick=function(){ if(isPro){alert('✨ 你已是会员，感谢支持！');return;} showPay(); };
  function showPay(){
    if(isPro)return;
    var m=mkMask('wbPay','🔒 免费额度已用完 · 解锁后继续使用');
    var plan_wx=true;
    function paint(){
      var plan=localStorage.getItem('wb_plan')||'year';
      m.querySelector('.bd').innerHTML=
        '<div style="font-size:12.5px;color:#8a8fb0">你已免费使用 '+PAY.free+' 次。解锁后无限次使用本站全部工具（含每日新增）。</div>'+
        '<div class="wbPlans"><div class="wbPlan'+(plan==='year'?' on':'')+'" data-p="year"><b>'+PAY.year+'</b><span>年度会员</span></div>'+
        '<div class="wbPlan'+(plan==='life'?' on':'')+'" data-p="life"><b>'+PAY.life+'</b><span>永久买断 · 更划算</span></div></div>'+
        '<div class="wbPayTabs"><button class="wx'+(plan_wx?' on':'')+'" data-w="wx">微信支付</button><button class="ali'+(plan_wx?'':' on')+'" data-w="ali">支付宝</button></div>'+
        '<div class="wbQrBox" id="wbQr"></div>'+
        '<button class="wbBtn" id="wbPaid" style="width:100%;margin-top:10px">✅ 我已完成支付，激活会员</button>'+
        '<div style="font-size:10.5px;color:#b6bad0;margin-top:6px;text-align:center">支付后点击激活（试运行自动开通；如遇问题请截图联系站长）<br>可关闭本窗，但关闭后将无法继续使用本工具，点💎可重新解锁</div>';
      m.querySelectorAll('.wbPlan').forEach(function(p){p.onclick=function(){localStorage.setItem('wb_plan',p.dataset.p);paint();}});
      m.querySelectorAll('.wbPayTabs button').forEach(function(b){b.onclick=function(){plan_wx=b.dataset.w==='wx';paint();};});
      var qrEl=m.querySelector('#wbQr'),src=plan_wx?PAY.wechat:PAY.alipay;
      qrEl.innerHTML=src?'<div><img src="'+src+'"><div style="font-size:11px;color:#8a8fb0;margin-top:4px">长按 / 扫码支付 '+(plan==='year'?PAY.year:PAY.life)+'</div></div>'
        :'<div style="font-size:12px;color:#8a8fb0">收款码配置中<br><br>↑ 微信 / 支付宝扫码后<br>向站长转账对应金额即可</div>';
      m.querySelector('#wbPaid').onclick=function(){localStorage.setItem('h5hub_pro','1');isPro=true;unblur();m.classList.remove('show');paintFree();alert('🎉 解锁成功，感谢支持！');};
    };
    paint();m.classList.add('show');
  }
  function blurPage(){document.body.classList.add('wbBlur');}
  function unblur(){document.body.classList.remove('wbBlur');}
  if(!isPro&&used>PAY.free){blurPage();showPay();}
})();
</script>
