<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书笔记排版器 · 一键生成爆款排版</title>
<meta name="description" content="输入草稿，一键生成带 emoji、分段、话题标签的小红书风格笔记排版，支持多套风格与实时预览，纯前端免费使用。">
<style>
:root{
  --bg1:#ffe3ee; --bg2:#fff0f6; --card:#ffffff; --primary:#ff2e63; --primary-2:#ff5b8a;
  --primary-soft:#ffe3ec; --text:#2a2330; --muted:#9a8fa0; --radius:20px;
  --shadow:0 14px 40px rgba(255,46,99,.12); --ok:#1fb56b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);padding:22px 16px 48px;line-height:1.65;min-height:100vh}
.wrap{max-width:680px;margin:0 auto}
header{text-align:center;margin-bottom:22px;animation:fadeUp .5s ease both}
header h1{font-size:26px;margin:0;letter-spacing:.5px}
header .tag{display:inline-block;margin-top:8px;font-size:12px;color:var(--primary);
  background:var(--primary-soft);padding:4px 12px;border-radius:999px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-bottom:16px;animation:fadeUp .5s ease both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px;font-weight:600}
textarea,input,select{width:100%;border:1.5px solid #f0e6ea;border-radius:14px;
  padding:13px;font-size:15px;font-family:inherit;resize:vertical;background:#fffafa;color:var(--text);transition:.18s}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{flex:1;min-width:90px;text-align:center;padding:10px;border-radius:12px;
  background:#fffafa;border:1.5px solid #f0e6ea;font-size:13px;cursor:pointer;transition:.18s;user-select:none}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(255,46,99,.28)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{flex:1;min-width:120px;border:none;border-radius:14px;padding:13px 16px;
  font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .18s;color:#fff}
.btn-main{background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 10px 22px rgba(255,46,99,.3)}
.btn-ghost{background:#f3eef1;color:var(--text)}
button:active{transform:scale(.96)}button:hover{box-shadow:0 14px 26px rgba(255,46,99,.34)}
.preview{background:linear-gradient(135deg,#fff,#fff6fa);border:1.5px dashed #ffd0df;
  border-radius:16px;padding:18px;min-height:130px;white-space:pre-wrap;font-size:15px;
  animation:pop .25s ease}
.stat{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.stat b{color:var(--primary)}
.tip{font-size:12px;color:var(--ok);margin-top:8px;min-height:16px;font-weight:600}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📒 小红书笔记排版器</h1>
    <span class="tag">实时预览 · 多套风格 · 一键复制</span>
  </header>

  <div class="card">
    <label>① 粘贴你的笔记草稿（每行一句，空行自动分段）</label>
    <textarea id="raw" rows="6" placeholder="今天去了一家超好吃的店&#10;环境很绝，随手一拍都是大片&#10;招牌菜必点，盲点不踩雷"></textarea>
    <label style="margin-top:16px">② 选择排版风格</label>
    <div class="chips" id="styleChips">
      <div class="chip active" data-s="cute">✨ 可爱</div>
      <div class="chip" data-s="literary">🍃 文艺</div>
      <div class="chip" data-s="clean">▫️ 极简</div>
    </div>
    <label style="margin-top:16px">③ 加话题标签（逗号分隔，可选）</label>
    <input id="tags" placeholder="美食,探店,宝藏店铺">
    <div class="row">
      <button class="btn-main" onclick="fmt()">✨ 一键排版</button>
      <button class="btn-ghost" onclick="copy()">📋 复制</button>
      <button class="btn-ghost" onclick="dl()">⬇️ 下载</button>
    </div>
    <div class="tip" id="tip"></div>
  </div>

  <div class="card">
    <label>④ 实时预览</label>
    <div id="out" class="preview">（在上方输入并点「一键排版」，这里会实时生成可复制的小红书排版 ✨）</div>
    <div class="stat">
      <span>字数：<b id="wc">0</b></span><span>emoji：<b id="ec">0</b></span><span>行数：<b id="lc">0</b></span>
    </div>
  </div>
</div>
<footer>纯前端工具 · 数据不上传 · 复制即可粘贴到小红书</footer>
<script>
const EMO=["✨","🔥","💡","🌟","🍃","📌","💫","🎯","🌈","⚡","💖","🥰","🍰","🌸"];
const LIT=["·","—","◦","▪","✦","◌","❀","✿"];
let style="cute";
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');style=c.dataset.s;
});
function count(){const t=document.getElementById('raw').value;
  document.getElementById('wc').textContent=[...t.replace(/\s/g,'')].length;
  document.getElementById('ec').textContent=(t.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu)||[]).length;
  document.getElementById('lc').textContent=t.split('\n').filter(x=>x.trim()).length;
}
document.getElementById('raw').addEventListener('input',count);
function fmt(){
  const raw=document.getElementById('raw').value.trim();
  if(!raw){document.getElementById('tip').textContent='先输入草稿～';return;}
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
  let body,mark='';
  if(style==='cute'){
    body=lines.map((l,i)=>(EMO[i%EMO.length]+' '+l)).join('\n\n');
  }else if(style==='literary'){
    body=lines.map((l,i)=>(LIT[i%LIT.length]+' '+l)).join('\n\n');
  }else{
    body=lines.map(l=>'· '+l).join('\n');
  }
  const tags=document.getElementById('tags').value.trim();
  if(tags){
    const t=tags.split(/[,，]/).map(s=>s.trim()).filter(Boolean).map(s=>s.startsWith('#')?s:'#'+s);
    body+='\n\n'+t.join(' ');
  }
  document.getElementById('out').textContent=body;
  document.getElementById('tip').textContent='已生成 ✓ 复制或下载后直接粘贴到小红书';
  count();
}
function copy(){const t=document.getElementById('out').textContent;
  if(!t||t.startsWith('（'))return;
  navigator.clipboard.writeText(t).then(()=>document.getElementById('tip').textContent='已复制到剪贴板 ✅');
}
function dl(){const t=document.getElementById('out').textContent;
  if(!t||t.startsWith('（'))return;
  const b=new Blob([t],{type:'text/plain'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='小红书笔记.txt';a.click();
}
</script>

</body>
</html>
