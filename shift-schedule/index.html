html[data-theme="dark"]{--bg:#12100e;--card:#1c1917;--txt:#f5efe9;--sub:#a89b90;--line:#2e2924;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.4)}

.ibtn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:15px}

h1{font-size:23px;margin:22px 0 6px;letter-spacing:-.3px}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:7px}
.card h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--pri)}
.card h2 .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select,input[type=date],input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:11px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(249,115,22,.14)}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:11px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;min-height:88px;line-height:1.7;outline:none}
.btn{border:0;border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.warn{background:linear-gradient(135deg,#f43f5e,#dc2626)}
.btn:disabled{opacity:.55;cursor:default}
.muted{color:var(--sub);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.tblbox{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
th{background:var(--bg);font-weight:700;color:var(--sub);padding:6px 4px;position:sticky;top:0;z-index:2;font-size:11.5px}
th.we{color:#f43f5e}
th.today{color:var(--pri)}
td.staff,th.staff{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;padding:6px 9px;font-weight:600;font-size:12.5px;min-width:82px;white-space:nowrap}
th.staff{z-index:3}
td.cell{cursor:pointer;min-width:34px;height:36px;transition:.12s;font-weight:700;font-size:12px}

td.cell .s{display:block;width:26px;height:22px;line-height:22px;border-radius:6px;margin:0 auto;color:#fff;font-size:11px;font-weight:800}
td.cell.weekend{background:rgba(244,63,94,.05)}
td.cell.isToday{background:rgba(249,115,22,.12)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.lg i{width:14px;height:14px;border-radius:4px;display:block}
.lg input[type=text]{width:auto;border:0;background:none;padding:0;font-size:12.5px;max-width:90px}
.lg .x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:14px;padding:0 2px}
.lg .x:hover{color:var(--danger)}

.today-card .big{font-size:19px;font-weight:800;margin:2px 0 10px}

.stats{width:100%;font-size:12.5px;border-collapse:collapse}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1a1614;color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}

  .card{border:0;box-shadow:none;padding:0}

function generate(){
  if(!st.staff.length){toast(tr("needStaff"));return;}
  if(!st.shifts.length){toast(tr("needShift"));return;}
  var seqRaw=document.getElementById("seqIn").value.split(/[,，\s]+/).filter(function(x){return x;});
  var idx=seqRaw.map(function(x){
    for(var i=0;i<st.shifts.length;i++){ if(st.shifts[i].s===x||st.shifts[i].n===x) return i; }
    return -1;
  }).filter(function(i){return i>=0;});
  if(!idx.length){toast(tr("needShift"));return;}
  var sd=document.getElementById("startDate").value||st.start;
  var step=parseInt(document.getElementById("stepIn").value,10)||0;
  st.start=sd; st.step=step;
  var s0=new Date(sd+"T00:00:00");
  var N=daysInMonth(st.month), y=+st.month.slice(0,4), mo=+st.month.slice(5,7);
  st.staff.forEach(function(p,si){
    var off=(p.o!=null?p.o:si*step);
    for(var d=1;d<=N;d++){
      var cur=new Date(y,mo-1,d);
      var diff=Math.round((cur-s0)/86400000);
      if(diff<0){ st.grid[gkey(si,d)]=""; continue; }
      var pos=((diff+off)%idx.length+idx.length)%idx.length;
      st.grid[gkey(si,d)]=idx[pos];
    }
  });
  save(); renderAll(); toast(tr("generated"));
}

document.getElementById("addStaffBtn").onclick=addStaff;

function addStaff(){
  var el=document.getElementById("staffIn"), v=el.value.trim(); if(!v) return;

}

};
document.getElementById("addShiftBtn").onclick=function(){

};
document.getElementById("genBtn").onclick=generate;
document.getElementById("clearGridBtn").onclick=function(){
  if(!confirm(tr("clearAsk")))return;
  Object.keys(st.grid).forEach(function(k){ if(k.indexOf(st.month+"|")===0) delete st.grid[k]; });
  save(); renderAll();
};
document.getElementById("monthIn").onchange=function(){ st.month=this.value||st.month; save(); renderAll(); };
document.getElementById("prevBtn").onclick=function(){ shiftMonth(-1); };
document.getElementById("nextBtn").onclick=function(){ shiftMonth(1); };
function shiftMonth(delta){
  var y=+st.month.slice(0,4), m=+st.month.slice(5,7)+delta;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  st.month=y+"-"+("0"+m).slice(-2); save(); renderAll();
}
document.getElementById("printBtn").onclick=function(){ window.print(); };
document.getElementById("csvBtn").onclick=function(){
  var N=daysInMonth(st.month);
  var rows=[[tr("name")]];
  var head=[tr("staff")]; for(var d=1;d<=N;d++) head.push(st.month+"-"+d); rows[0]=head;
  st.staff.forEach(function(p,si){
    var r=[p.n];
    for(var d=1;d<=N;d++){ var v=st.grid[gkey(si,d)]; r.push((v==null||v==="")?"":(st.shifts[v]?st.shifts[v].n:"")); }
    rows.push(r);
  });
  var csv="\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  dl(new Blob([csv],{type:"text/csv"}),"shift-"+st.month+".csv"); toast(tr("exported"));
};
document.getElementById("shareBtn").onclick=function(){ buildShare(); document.getElementById("shareDlg").showModal(); };
document.getElementById("closeShareBtn").onclick=function(){ document.getElementById("shareDlg").close(); };
document.getElementById("dlShareBtn").onclick=function(){ document.getElementById("shareCv").toBlob(function(b){ dl(b,"shift-share.png"); }); };
document.getElementById("themeBtn").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",cur);

};
var ls=document.getElementById("langSel");
LANGS.forEach(function(l){var o=document.createElement("option");o.value=l;o.textContent=LNAME[l];ls.appendChild(o);});
ls.onchange=function(){ lang=ls.value; try{localStorage.setItem("sh_lang",lang);}catch(e){} applyI18n(); };
(function init(){
  var q=new URLSearchParams(location.search).get("lang"), saved=null;
  try{saved=localStorage.getItem("sh_lang");}catch(e){}
  var nav=(navigator.language||"zh").toLowerCase();
  var guess=nav.indexOf("ja")===0?"ja":nav.indexOf("ko")===0?"ko":nav.indexOf("es")===0?"es":nav.indexOf("fr")===0?"fr":nav.indexOf("en")===0?"en":"zh";
  lang=q||saved||guess; if(LANGS.indexOf(lang)<0) lang="zh"; ls.value=lang;
  var th=null; try{th=localStorage.getItem("sh_theme");}catch(e){}
  if(!th) th=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.setAttribute("data-theme",th);
  applyI18n();
})();
})();

      qrEl.innerHTML=src?'<div><img src="'+src+'"><div style="font-size:11px;color:#8a8fb0;margin-top:4px">长按 / 扫码支付 '+(plan==='year'?PAY.year:PAY.life)+'</div></div>'
        :'<div style="font-size:12px;color:#8a8fb0">收款码配置中<br><br>↑ 微信 / 支付宝扫码后<br>向站长转账对应金额即可</div>';
      m.querySelector('#wbPaid').onclick=function(){localStorage.setItem('h5hub_pro','1');isPro=true;unblur();m.classList.remove('show');paintFree();alert('🎉 解锁成功，感谢支持！');};
    };
    paint();m.classList.add('show');
  }
  function blurPage(){document.body.classList.add('wbBlur');}
  function unblur(){document.body.classList.remove('wbBlur');}
  if(!isPro&&used>PAY.free){blurPage();showPay();}
})();
</script>
